name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens/updates the release PR (version bump + CHANGELOG.md). Merging it creates tag vX.Y.Z + GitHub release.
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          target-branch: main   # release branch; keep in sync with team.md -> Branches
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in the same workflow because tags created with GITHUB_TOKEN don't trigger other workflows.
  publish-image:
    needs: release-please
    # hashFiles() is not allowed in a job-level `if` (it made the whole workflow invalid), so it is checked per step.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: hashFiles('Dockerfile') != ''
        name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          TAG=${{ needs.release-please.outputs.tag_name }}
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:sha-${GITHUB_SHA::7}" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
