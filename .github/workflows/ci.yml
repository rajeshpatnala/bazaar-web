name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# One group per ref, so a run never cancels another ref's runs. Only PR runs are cancelled when superseded;
# pushes to develop/main always finish (their macOS test would otherwise be cancelled by the next push).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Decides what the PR needs (scripts/ci-scope.py; `just ci-scope` runs the same). Full workspace on push,
  # workflow_dispatch, PRs not into develop (promotion/release) and when shared files change; fail-safe is full.
  # Skipped jobs report SKIPPED, which GitHub branch protection and `just merge-check` both count as passing.
  # pr-title, secrets-scan and deny always run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      web: ${{ steps.scope.outputs.web }}
      full: ${{ steps.scope.outputs.full }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -eo pipefail   # a crash fails this job (and so the PR); it never leaves outputs empty
          # Run the scope script from the base ref so a PR cannot edit its own gate (a PR that edits scripts/ or
          # workflows is a full run anyway). Falls back to the head copy only while the base has none.
          git show origin/develop:scripts/ci-scope.py > "$RUNNER_TEMP/ci-scope.py" 2>/dev/null || cp scripts/ci-scope.py "$RUNNER_TEMP/ci-scope.py"
          if [ "$EVENT" = pull_request ] && [ "$BASE" = develop ]; then
            python3 "$RUNNER_TEMP/ci-scope.py" "origin/$BASE" | tee -a "$GITHUB_OUTPUT"
          else
            python3 "$RUNNER_TEMP/ci-scope.py" origin/develop --full | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: hashFiles('Cargo.toml') != ''
        name: install pinned system DuckDB (version from Cargo.toml, sha256-checked)
        run: sh scripts/install-duckdb.sh linux-amd64
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { components: "rustfmt, clippy" }
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check
      - if: hashFiles('Cargo.toml') != '' && needs.changes.outputs.full == 'yes'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: hashFiles('Cargo.toml') != '' && needs.changes.outputs.full != 'yes'
        name: clippy on changed crates and their dependents
        env: { PKGS: "${{ needs.changes.outputs.packages }}" }
        run: cargo clippy $PKGS --all-targets -- -D warnings
      - if: hashFiles('crates/broker/Cargo.toml') != ''
        name: gated broker crate is lint-clean (no live calls)
        run: cargo clippy -p bazaar-broker --features live-trading -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: hashFiles('Cargo.toml') != ''
        name: install pinned system DuckDB (version from Cargo.toml, sha256-checked)
        run: sh scripts/install-duckdb.sh linux-amd64
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { components: "llvm-tools-preview" }
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with: { tool: "cargo-nextest,cargo-llvm-cov" }
      - if: hashFiles('Cargo.toml') != '' && needs.changes.outputs.full != 'yes'
        name: tests on changed crates and their dependents (coverage gate runs on the full run)
        env: { PKGS: "${{ needs.changes.outputs.packages }}" }
        run: cargo nextest run $PKGS --no-tests=pass
      - if: hashFiles('Cargo.toml') != '' && needs.changes.outputs.full == 'yes'
        run: cargo llvm-cov nextest --workspace --no-tests=pass --lcov --output-path lcov.info --fail-under-lines 75
      - if: hashFiles('Cargo.toml') != '' && needs.changes.outputs.full == 'yes'
        run: cargo test --doc --workspace
      - if: hashFiles('Cargo.toml') != '' && needs.changes.outputs.full != 'yes'
        env: { PKGS: "${{ needs.changes.outputs.packages }}" }
        run: cargo test --doc $PKGS

  web:
    needs: changes
    if: needs.changes.outputs.web == 'yes'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: hashFiles('web/package.json') != ''
        name: pinned tool versions (packageManager, .nvmrc)
        run: |
          node -e "if(!require('./package.json').packageManager){console.log('::error::add packageManager (e.g. pnpm@10.x) to web/package.json; pnpm/action-setup needs it');process.exit(1)}"
          test -f .nvmrc || { echo '::error::add web/.nvmrc with the Node major (setup-node reads it)'; exit 1; }
      - if: hashFiles('web/package.json') != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: hashFiles('web/package.json') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('web/package.json') != ''
        run: pnpm typecheck
      - if: hashFiles('web/package.json') != ''
        run: pnpm lint
      - if: hashFiles('web/package.json') != ''
        run: pnpm test:ci
      - if: hashFiles('web/package.json') != ''
        run: pnpm audit --prod
      - if: hashFiles('web/package.json') != ''
        run: pnpm build
      - if: hashFiles('web/playwright.config.ts') != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: hashFiles('web/playwright.config.ts') != ''
        run: pnpm e2e

  test-macos:
    # Owner decision (2026-11-18): manual-only. macOS runners queue for a long time, so this job never runs
    # automatically; the Linux `test` job is the PR gate. It stays in the plan because it compiles the Keychain
    # store (the owner's platform). Run it from Actions > ci > Run workflow. To re-enable it after merges,
    # restore the push condition: if: github.event_name == 'push'.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: install pinned system DuckDB (version from Cargo.toml, sha256-checked)
        run: sh scripts/install-duckdb.sh osx-universal
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with: { tool: cargo-nextest }
      - if: hashFiles('Cargo.toml') != ''
        run: cargo nextest run --workspace --no-tests=pass

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: hashFiles('Cargo.lock') != ''
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2

  # Permanent guard (not a bypass): the steps run only once the generated API
  # schema (web/src/api/schema.d.ts) is committed. The guard checks that file
  # only; it is committed alongside the server `openapi` command and the web
  # `gen:api` script (F1 slice 7), so the job self-activates then.
  openapi-drift:
    needs: changes
    if: needs.changes.outputs.rust == 'yes' || needs.changes.outputs.web == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != '' && hashFiles('web/src/api/schema.d.ts') != ''
        name: install pinned system DuckDB (version from Cargo.toml, sha256-checked)
        run: sh scripts/install-duckdb.sh linux-amd64
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != '' && hashFiles('web/src/api/schema.d.ts') != ''
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != '' && hashFiles('web/src/api/schema.d.ts') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != '' && hashFiles('web/src/api/schema.d.ts') != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: web/package.json }
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != '' && hashFiles('web/src/api/schema.d.ts') != ''
        name: regenerate UI types and fail on drift
        run: |
          cargo run -q -p bazaar-server -- openapi > web/openapi.json
          pnpm -C web install --frozen-lockfile
          pnpm -C web gen:api
          git diff --exit-code -- web/src/api/schema.d.ts
