name: ci
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# One group per ref, so a run never cancels another ref's runs. Only PR runs are cancelled when superseded;
# pushes to develop/main always finish (their macOS test would otherwise be cancelled by the next push).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check
      - if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: hashFiles('crates/broker/Cargo.toml') != ''
        name: gated broker crate is lint-clean (no live calls)
        run: cargo clippy -p bazaar-broker --features live-trading -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with: { components: "llvm-tools-preview" }
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest,cargo-llvm-cov" }
      - if: hashFiles('Cargo.toml') != ''
        run: cargo llvm-cov nextest --workspace --no-tests=pass --lcov --output-path lcov.info --fail-under-lines 75
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test --doc --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - if: hashFiles('web/package.json') != ''
        uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: hashFiles('web/package.json') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('web/package.json') != ''
        run: pnpm typecheck
      - if: hashFiles('web/package.json') != ''
        run: pnpm lint
      - if: hashFiles('web/package.json') != ''
        run: pnpm test:ci
      - if: hashFiles('web/package.json') != ''
        run: pnpm audit --prod
      - if: hashFiles('web/package.json') != ''
        run: pnpm build
      - if: hashFiles('web/playwright.config.ts') != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: hashFiles('web/playwright.config.ts') != ''
        run: pnpm e2e

  test-macos:
    # macOS runners queue for a long time and PR runs were cancelled before starting; the Linux `test` job is the
    # PR test gate, so macOS (the owner's platform, compiles the Keychain store) runs only after merge on develop/main.
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - if: hashFiles('Cargo.toml') != ''
        run: cargo nextest run --workspace --no-tests=pass

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: hashFiles('Cargo.lock') != ''
        uses: EmbarkStudios/cargo-deny-action@v2

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != ''
        uses: dtolnay/rust-toolchain@stable
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != ''
        uses: Swatinem/rust-cache@v2
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != ''
        uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - if: hashFiles('crates/server/Cargo.toml') != '' && hashFiles('web/package.json') != ''
        name: regenerate UI types and fail on drift
        run: |
          cargo run -q -p bazaar-server -- openapi > web/openapi.json
          pnpm -C web install --frozen-lockfile
          pnpm -C web gen:api
          git diff --exit-code -- web/src/api/schema.d.ts
