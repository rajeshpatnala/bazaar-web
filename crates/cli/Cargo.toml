[package]
name = "bazaar-cli"
description = "Headless composition root (clap): check-connections, imports, backtest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bazaar-broker = { workspace = true, optional = true }
bazaar-core.workspace = true
bazaar-data.workspace = true
bazaar-execution.workspace = true
bazaar-paper.workspace = true
bazaar-risk.workspace = true
bazaar-store.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
bazaar-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
serde_json.workspace = true
sqlx.workspace = true
toml.workspace = true

[features]
default = []
live-trading = ["dep:bazaar-broker", "bazaar-broker/live-trading"]
