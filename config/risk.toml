# risk.toml: owner-set thresholds (profile decision recorded 2026-11-18 in the F1 plan).
# Percentages and rupee amounts are strings (never TOML floats). The mode is edited here only:
# there is no env var, CLI flag or HTTP route for it.
schema_version = 1
verified_on = "2026-11-18"
source = "owner"

[mode]
execution_mode = "paper"

[limits]
max_risk_per_trade_pct = "1"
max_daily_loss_pct = "3"
on_daily_loss = "lockout_entries"
# F6 keys below: owner-decided 2026-11-19 (.agents/decisions.md): max_open_positions, max_position_value_pct,
# max_weekly_loss_pct (G19). Every other key in the sections below: source = owner-to-confirm,
# verified_on = unverified. The file-level verified_on above is deliberately not bumped.
max_open_positions = 3                  # G04a, Soft, owner decided 2026-11-19
max_total_open_risk_pct = "3"           # G04b, Hard; owner-to-confirm, unverified
max_weekly_loss_pct = "6"               # G19, Hard; owner decided 2026-11-19
max_position_value_pct = "25"           # G14, Soft; owner decided 2026-11-19
max_orders_per_minute = 4               # G16; owner-chosen 2026-11-20, still unverified, no broker/SEBI source cited
max_orders_per_day = 12                 # G16; unverified, owner to confirm
max_notional_per_order_inr = "25000"    # G16, rupees; unverified, owner to confirm
min_charges_slippage_buffer = "60"      # rupees; placeholder, unverified; derive from charges.toml with the F9 cost model
cap_equity_at_starting_cash = true      # sizing equity never rises above starting cash (owner Q2 default), unverified

# Ceilings: the loader refuses a [limits] value above its ceiling, but both sit in this owner-editable
# file, so the loader cannot tell a raised ceiling from an original one. Never raise a ceiling
# without an ADR in DECISIONS.md and the owner's explicit approval. An enforced check outside this
# file is a follow-up for the DecisionGate feature.
[hard_limits]
max_risk_per_trade_pct = "1"
max_daily_loss_pct = "3"
max_total_open_risk_pct = "3"           # owner-to-confirm, unverified
max_weekly_loss_pct = "6"               # owner decided 2026-11-19
# Ceilings for the No-row behaviour keys: the file cannot loosen them past these (owner 2026-11-19).
# "max_" = the value may not exceed it; "min_" = the value may not go below it. Unverified.
max_cooloff_after_losses = 2            # owner decided 2026-11-19 (G08)
max_new_entries_per_day = 3             # owner decided 2026-11-19 (G18)
min_reentry_lockout_minutes = 60        # owner decided 2026-11-19 (G17)
max_entry_zone_tolerance_bps = 0        # owner-to-confirm, unverified (G10)
# Ceilings added with F6 slice 1 (owner answer to RISK-44-1, 2026-11-19).
max_position_value_pct = "25"           # G14; owner decided 2026-11-19
max_sector_pct = "30"                   # G05; unverified, owner to confirm
max_open_positions = 3                  # G04a; unverified, owner to confirm
max_orders_per_minute = 4               # G16; owner-chosen 2026-11-20, still unverified, no source (needs a cited source)
max_orders_per_day = 12                 # G16; unverified, owner to confirm
max_notional_per_order_inr = "25000"    # G16, rupees; unverified, owner to confirm
max_override_per_day = 1                # unverified, owner to confirm
max_override_per_week = 3               # unverified, owner to confirm
# Added in F6 slice 1c (RISK-52-7). 20 equals the loader minimum on purpose; raising the floor
# needs the owner and an ADR in DECISIONS.md.
min_correlation_window_days = 20         # G05 floor; unverified, owner to confirm
# Added in F6 slice 1b; all at their defaults, unverified, owner to confirm (RISK-46-3, RISK-46-4).
max_ban_list_age_hours = 24             # G06
max_quote_age_secs = 5                  # G15
max_snapshot_age_secs = 10
latest_expiry_day_no_new_after_ist = "13:30"   # G07
min_confirm_delay_secs = 10             # override cooling delay may not go below this
max_size_factor = "0.5"                 # an overridden trade may not be sized above this
min_oos_trades = 30                     # G01 floor, equals the default; no loosening without the owner

[execution]
paper_starting_cash_inr = "100000"

# G05 sector and correlation (Soft). All four: owner-to-confirm, unverified.
[exposure]
max_sector_pct = "30"
max_correlated_positions = 2
correlation_threshold = "0.7"
correlation_window_days = 60

# Behaviour guards (No rows; G09/G11 are Hard and the loader refuses true).
[behaviour]
cooloff_after_losses = 2                # G08, owner decided 2026-11-19
cooloff_until = "end_of_session"        # G08, owner-to-confirm, unverified
allow_stop_widening = false             # G09, loader refuses true
allow_averaging_down = false            # G11, loader refuses true
entry_zone_tolerance_bps = 0            # G10, owner-to-confirm, unverified
reentry_lockout_minutes = 60            # G17, owner decided 2026-11-19
max_new_entries_per_day = 3             # G18, owner decided 2026-11-19

# F6 slice 1 keys. All owner-to-confirm, unverified (no figure below is from a broker or SEBI source).
[options]
allow_naked_short = false               # G13, loader refuses true

[events]
block_ban_list = true                   # G06, loader refuses false
ban_list_max_age_hours = 24             # G06
block_results_days = true               # G07, loader refuses false
block_policy_days = true                # G07, loader refuses false
expiry_day_no_new_after_ist = "13:30"   # G07
events_file = "events.toml"             # G07, relative to config/

[data]
max_quote_age_secs = 5                  # G15
max_snapshot_age_secs = 10              # snapshot staleness (RG-F6-15); own key, not the quote age

[gate.evidence]
min_oos_trades = 30                     # G01
min_profit_factor = "1.3"               # G01
min_expectancy_r = "0.1"                # G01
require_walk_forward_pass = true        # G01

[override]
max_per_day = 1                         # ceiling in [hard_limits]
max_per_week = 3                        # ceiling in [hard_limits]
size_factor = "0.5"                     # 0 < x <= 1
confirm_delay_secs = 10
