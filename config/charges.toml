# charges.toml: Zerodha equity charges as listed on the page the owner pasted on 2026-11-20
# (copies in docs/owner-input/F2-charges.md). Only numbers from those pastes are used.
# effective_from = 2026-11-20 for every row: the source gives no effective date, so the verified date is used.
# Delivery rows and [dp] come from the owner's "Charges explained" paste (same date and page).
# Not modelled (no schema place): delivery minimum Rs 0.01 per contract note; physically settled F&O rates;
# DP discounts (female first holder, MF/bond); currency segments. IPFT is the NSE rate (Rs 0.01 per crore =
# 0.0000001 percent); the paste lists no BSE IPFT, so BSE rows keep "0" meaning not listed.
# No contract-note cross-check yet.
schema_version = 1
verified_on = "2026-11-20"
source = "Zerodha charges page https://zerodha.com/charges/#tab-equities (owner-pasted 2026-11-20); statutory rates (STT/CTT, exchange, SEBI, stamp, IPFT) as listed by Zerodha, not checked against NSE/SEBI circulars"

[meta]
broker = "zerodha"
currency = "INR"
max_age_days = 90
history_policy = "effective_dated"

[gst]
rate_pct = "18"
verified_on = "2026-11-20"
source = "Zerodha charges page https://zerodha.com/charges/#tab-equities (owner-pasted 2026-11-20); statutory rates (STT/CTT, exchange, SEBI, stamp, IPFT) as listed by Zerodha, not checked against NSE/SEBI circulars: 18% on brokerage + SEBI charges + transaction charges"

[dp]
per_scrip_total = "15.34"
includes_gst = true
verified_on = "2026-11-20"
source = "Zerodha charges page https://zerodha.com/charges/#tab-equities (owner-pasted 2026-11-20); statutory rates (STT/CTT, exchange, SEBI, stamp, IPFT) as listed by Zerodha, not checked against NSE/SEBI circulars: Rs 15.34 per scrip on sale = 3.5 CDSL + 9.5 Zerodha + 2.34 GST, irrespective of quantity"

[option_exercise]
stt_pct = "0.15"
verified_on = "2026-11-20"
source = "Zerodha charges page https://zerodha.com/charges/#tab-equities (owner-pasted 2026-11-20); statutory rates (STT/CTT, exchange, SEBI, stamp, IPFT) as listed by Zerodha, not checked against NSE/SEBI circulars: 0.15% of intrinsic value on options bought and exercised"

