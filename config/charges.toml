segment = "equity_intraday"
side = "buy"
effective_from = "2026-11-20"
verified_on = "2026-11-20"
source = "Zerodha charges page https://zerodha.com/charges/#tab-equities (owner-pasted 2026-11-20); statutory rates (STT/CTT, exchange, SEBI, stamp) as listed by Zerodha, not checked against NSE/SEBI circulars"
turnover_basis = "notional"
brokerage = { kind = "flat_or_pct_lower", flat = "20", pct = "0.03" }
stt_ctt_pct = "0"
exchange_txn_pct = "0.00307"
sebi_per_crore = "10"
ipft_pct = "0"
stamp_pct = "0.003"

