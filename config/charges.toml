# charges.toml: Zerodha equity charges as listed on the page the owner pasted on 2026-11-20
# (copy in docs/owner-input/F2-charges.md). Only numbers from that paste are used.
# effective_from = 2026-11-20 for every row: the source gives no effective date, so the verified date is used.
# NOT shipped: equity_delivery rate sets (the schema requires [dp], and the DP charge Rs 15.34 and delivery
# minimum seen only in an agent web fetch are UNVERIFIED), physically settled F&O rates, IPFT (not in the
# source: ipft_pct = "0" means "not listed", not "verified zero"). No contract-note cross-check yet.
schema_version = 1
verified_on = "2026-11-20"
source = "Zerodha charges page https://zerodha.com/charges/#tab-equities (owner-pasted 2026-11-20); statutory rates (STT/CTT, exchange, SEBI, stamp) as listed by Zerodha, not checked against NSE/SEBI circulars"

[meta]
broker = "zerodha"
currency = "INR"
max_age_days = 90
history_policy = "effective_dated"

[gst]
rate_pct = "18"
verified_on = "2026-11-20"
source = "Zerodha charges page https://zerodha.com/charges/#tab-equities (owner-pasted 2026-11-20); statutory rates (STT/CTT, exchange, SEBI, stamp) as listed by Zerodha, not checked against NSE/SEBI circulars: 18% on brokerage + SEBI charges + transaction charges"

[option_exercise]
stt_pct = "0.15"
verified_on = "2026-11-20"
source = "Zerodha charges page https://zerodha.com/charges/#tab-equities (owner-pasted 2026-11-20); statutory rates (STT/CTT, exchange, SEBI, stamp) as listed by Zerodha, not checked against NSE/SEBI circulars: 0.15% of intrinsic value on options bought and exercised"

