# calendar.toml: NSE equity calendar for 2026 only (covered_years = [2026]).
# Source: NSE "Exchange Communication - Holidays" page, text pasted by the owner on 2026-11-20
# (copy in docs/owner-input/F2-calendar.md). Holiday rows have no per-row source field in the
# schema, so every [[holiday]] row comes from the page URL in the top-level `source`.
# The circular id (reported 172/2025 dated 2025-12-12) is UNVERIFIED and is not recorded here.
# Not in the owner's source, so deliberately absent: derivatives/currency/commodity session
# windows, closing-auction / closing-session rows (applicability by instrument kind and start date
# unknown), and any year other than 2026. Holidays are applied to equity and equity_derivatives
# (owner-pasted page is the NSE holiday list; the derivatives mapping is an assumption to confirm).
schema_version = 1
verified_on = "2026-11-20"
source = "https://www.nseindia.in/resources/exchange-communication-holidays (owner-pasted 2026-11-20; circular id unverified)"
covered_years = [2026]

# Equity timings (IST). effective_from is the start of the covered year: the source gives no date.

[[session]]
segment = "equity"
applies_to = "cash_non_fno"
phase = "pre_open"
start = "09:00"
end = "09:15"
effective_from = "2026-01-01"
source = "NSE holidays page, equity segment timings: pre-open 09:00-09:15 (order entry 09:00-09:10, matching 09:10-09:12, buffer 09:12-09:15); verified_on 2026-11-20"

[[session]]
segment = "equity"
applies_to = "cash_non_fno"
phase = "normal"
start = "09:15"
end = "15:30"
effective_from = "2026-01-01"
source = "NSE holidays page, equity segment timings: regular session 09:15-15:30; verified_on 2026-11-20"

[[session]]
segment = "equity"
applies_to = "cash_fno"
phase = "pre_open"
start = "09:00"
end = "09:15"
effective_from = "2026-01-01"
source = "NSE holidays page, equity segment timings: pre-open 09:00-09:15 (order entry 09:00-09:10, matching 09:10-09:12, buffer 09:12-09:15); verified_on 2026-11-20"

[[session]]
