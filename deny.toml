# cargo-deny config for Bazaar. Run `cargo deny check` once on the first full build and adjust with an owner note.
[advisories]
version = 2
yanked = "deny"
# 2026-11-18: "unmaintained" notices only; owner approved chrono in the F1 dependency set. Revisit via ADR.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice; owner approved chrono in F1, revisit via ADR" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained notice; owner approved chrono-tz in F1, revisit via ADR" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "CC0-1.0",
  "MPL-2.0",   # e.g. webpki-roots and other common deps (file-level copyleft; fine for an unmodified dependency)
]
confidence-threshold = 0.9

[licenses.private]
ignore = true   # workspace crates are publish = false with a non-SPDX "Proprietary" licence

[bans]
multiple-versions = "warn"   # large dep trees pull duplicates; review, don't block
wildcards = "deny"
allow-wildcard-paths = true  # internal path dependencies in the workspace
deny = [
  { name = "openssl-sys", reason = "use rustls" },
  { name = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
